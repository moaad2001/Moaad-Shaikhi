<style>
/* Concept: night-time, controlled, expensive. A cinematic portrait that fades into near-black, a warm gold accent, and plain links that rise into view as the visitor scrolls.
   Single dark look, so every colour is set explicitly. */
:root {
  --bg: #14111A;
  --surface: rgba(38, 30, 46, .72);
  --surface-hover: rgba(52, 41, 60, .85);
  --line: rgba(245, 205, 185, .17);
  --ink: #F7EFE7;
  --muted: #BBAEAC;
  --night-top: #3B3652;
  --night-mid: #231E30;
  --amber: #FFB100;
  --amber-press: #E69E00;
  --on-amber: #0A0A0B;
  --focus: #FFB100;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
  background-image:
    radial-gradient(110% 45% at 50% 4%, rgba(226, 168, 146, .34) 0%, rgba(226, 168, 146, 0) 70%),
    linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 40%, var(--bg) 75%),
    radial-gradient(80% 40% at 50% 112%, rgba(255, 177, 0, .10) 0%, rgba(255, 177, 0, 0) 70%);
  background-repeat: no-repeat;
  background-attachment: fixed;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.page { width: 100%; max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }

/* Hero */
.hero {
  position: relative; isolation: isolate; overflow: hidden; border-radius: 28px;
  min-height: clamp(470px, 74vh, 600px); display: flex; align-items: flex-end;
  background: radial-gradient(120% 90% at 50% 20%, #4A3A52 0%, #17131E 70%);
}
.hero .mono { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 120px; letter-spacing: -.04em; color: #54425C; z-index: -1; }
.hero img {
  position: absolute; left: 0; top: 0; width: 100%; height: 112%; object-fit: cover; object-position: 60% 0%;
  z-index: -3; transform: translate3d(0, var(--py, 0px), 0); will-change: transform;
  filter: brightness(1) contrast(1.1) saturate(1.15);
}
.hero::before { /* edge vignette: turns the pale wall to night while the face stays lit */
  content: ""; position: absolute; inset: 0; z-index: -2;
  background:
    radial-gradient(90% 70% at 55% 40%, rgba(20,17,26,0) 55%, rgba(20,17,26,.45) 100%),
    linear-gradient(to bottom, rgba(59,54,82,.25) 0%, rgba(20,17,26,0) 25%);
}
.hero::after { /* fade into the page */
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, #17131E 0%, rgba(23,19,30,.92) 20%, rgba(23,19,30,0) 62%);
}
.cap { padding: 0 22px 26px; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(42px, 12.5vw, 56px); line-height: .98; letter-spacing: -.035em; }
h1 i { font-style: normal; color: var(--amber); }
.line { margin: 0; font-size: 18px; color: var(--ink); opacity: .82; font-weight: 500; max-width: 28ch; text-wrap: balance; }

/* Links */
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 14px 14px 14px 20px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
a.card:hover { transform: translateY(-2px); border-color: var(--amber); background: var(--surface-hover); }
.card.primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
a.card.primary:hover { background: var(--amber-press); border-color: var(--amber-press); }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.label { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; letter-spacing: -.01em; }
.meta { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.primary .meta { color: #4A3300; }
.card.primary { -webkit-backdrop-filter: none; backdrop-filter: none; }
.address { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.go { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--on-amber); transition: transform .2s ease, background .2s ease; }
.primary .go { background: var(--on-amber); color: var(--amber); }
.go svg { width: 18px; height: 18px; }
a.card:hover .go { transform: translate(2px, -2px); }
.copy { flex: none; min-width: 76px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; background: var(--amber); color: var(--on-amber); font-family: var(--font-display); font-weight: 700; font-size: 15px; transition: background .15s ease; }
.copy:hover { background: var(--amber-press); }
.tag { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--amber); color: var(--amber); font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

.legal { margin: 4px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Scroll reveal: items start low and faint, then rise when they enter the screen. Only active when JS runs. */
.js .rise { opacity: 0; transform: translate3d(0, 34px, 0) scale(.97); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0ms); }
.js .rise.in { opacity: 1; transform: none; }
.js .rise.in.card:hover, .js a.rise.in:hover { transition-delay: 0ms; }

@media (prefers-reduced-motion: reduce) {
  .js .rise { opacity: 1; transform: none; transition: none; }
  .card, .go { transition: none; } a.card:hover, a.card:hover .go { transform: none; }
  .hero img { transform: none; }
}
@media (min-width: 560px) { body { padding-block: 40px 64px; } }
</style>

(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img = document.getElementById("avatar-img");
  if (CONFIG.avatar) {
    img.onload = function () { img.hidden = false; document.getElementById("monogram").hidden = true; };
    img.src = CONFIG.avatar;
  }
  function live(id, tagId, url) {
    if (!url) return;
    var a = document.getElementById(id), t = document.getElementById(tagId);
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.removeAttribute("aria-disabled");
    var go = document.createElement("span");
    go.className = "go"; go.setAttribute("aria-hidden", "true");
    go.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
    t.replaceWith(go);
  }
  live("newsletter-link", "newsletter-tag", CONFIG.newsletter);
  live("youtube-link", "youtube-tag", CONFIG.youtube);

  /* Scroll reveal */
  var items = document.querySelectorAll(".rise");
  function show(el) { el.classList.add("in"); }
  if (!("IntersectionObserver" in window) || reduce) {
    items.forEach(show);
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.2, rootMargin: "0px 0px -2% 0px" });
    items.forEach(function (el) { io.observe(el); });
    setTimeout(function () { items.forEach(function (el) { if (el.getBoundingClientRect().top < window.innerHeight) show(el); }); }, 1500);
  }

  /* Gentle parallax on the portrait */
  if (!reduce) {
    var hero = document.querySelector(".hero"), ticking = false;
    function tick() {
      var y = Math.min(window.scrollY, hero.offsetHeight);
      hero.style.setProperty("--py", (y * 0.12).toFixed(1) + "px");
      ticking = false;
    }
    window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }, { passive: true });
  }

  var btn = document.getElementById("copy-btn");
  var status = document.getElementById("copy-status");
  var addr = document.getElementById("email-text");
  btn.addEventListener("click", function () {
    function done(msg) {
      btn.textContent = msg;
      status.textContent = msg === "Copied" ? "Email address copied" : "Select the address to copy it";
      setTimeout(function () { btn.textContent = "Copy"; }, 1800);
    }
    function fallback() {
      try { var r = document.createRange(); r.selectNodeContents(addr); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
      done("Select");
    }
    try {
      navigator.clipboard.writeText(addr.textContent.trim()).then(function () { done("Copied"); }, fallback);
    } catch (e) { fallback(); }
  });
})();
